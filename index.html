<style>
/* Middag – japandi
   Papir, sumi-blekk, eik, mose og ett hanko-rødt stempel. */
:root{
  --bg:#F2EEE6;        /* washi */
  --surface:#F8F5EF;
  --surface-2:#E9E3D8;
  --ink:#1F1D1A;       /* sumi */
  --ink-2:#6B645A;
  --ink-3:#958C7F;
  --line:#D9D1C4;
  --oak:#8C6E48;
  --oak-soft:#E6DCCB;
  --moss:#5F6B55;
  --moss-soft:#E1E3D6;
  --beni:#A34A36;      /* hanko */
  --on-ink:#F2EEE6;
  --scrim:rgba(31,29,26,.38);
  --serif:"Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN",Georgia,serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#191816; --surface:#211F1C; --surface-2:#2B2824; --ink:#ECE6DB; --ink-2:#A69D8F; --ink-3:#7C7468;
    --line:#37332E; --oak:#C4A47A; --oak-soft:#342C22; --moss:#A3B096; --moss-soft:#262A22;
    --beni:#C9664F; --on-ink:#191816; --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#191816; --surface:#211F1C; --surface-2:#2B2824; --ink:#ECE6DB; --ink-2:#A69D8F; --ink-3:#7C7468;
  --line:#37332E; --oak:#C4A47A; --oak-soft:#342C22; --moss:#A3B096; --moss-soft:#262A22;
  --beni:#C9664F; --on-ink:#191816; --scrim:rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.6; font-weight:400;
  -webkit-font-smoothing:antialiased; letter-spacing:.01em;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:1.5px solid var(--oak);outline-offset:3px}

/* ---------- Topp ---------- */
header{padding:calc(40px + env(safe-area-inset-top)) 0 28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.brand h1{margin:0;font-family:var(--serif);font-weight:500;font-size:46px;line-height:1;letter-spacing:.02em}
.brand p{margin:12px 0 0;color:var(--ink-2);font-size:14px;letter-spacing:.06em}
.hanko{
  flex:none;width:44px;height:44px;display:grid;place-items:center;
  background:var(--beni);color:var(--bg);border-radius:3px;
  font-family:var(--serif);font-weight:700;font-size:26px;line-height:1;
  transform:rotate(-3deg);margin-bottom:4px;
}

/* ---------- Valg ---------- */
.panel{padding:28px 0 8px;display:grid;gap:26px}
.label{margin:0 0 12px;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);background:transparent;border-radius:2px;
  padding:8px 16px;font-size:14px;letter-spacing:.04em;cursor:pointer;min-height:40px;
  display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);
  transition:background .2s,border-color .2s,color .2s;
}
@media (hover:hover){.chip:hover{border-color:var(--ink-3);color:var(--ink)}}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip.fav svg{width:14px;height:14px}
.chip.fav[aria-pressed="true"]{background:var(--beni);border-color:var(--beni);color:var(--bg)}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:2px}
.step-btn{width:44px;height:40px;border:0;background:transparent;font-size:18px;font-weight:300;cursor:pointer;color:var(--ink)}
.step-btn:disabled{opacity:.25;cursor:default}
.step-val{min-width:104px;text-align:center;font-size:14px;letter-spacing:.04em;font-variant-numeric:tabular-nums;border-inline:1px solid var(--line);line-height:40px}

select{
  font:inherit;font-size:14px;letter-spacing:.04em;color:var(--ink);background-color:transparent;
  border:1px solid var(--line);border-radius:2px;padding:8px 38px 8px 14px;min-height:42px;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat;
}

/* ---------- Liste ---------- */
.results-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:40px 0 8px;padding-bottom:16px;border-bottom:1px solid var(--ink)}
.results-head h2{margin:0;font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1}
.count{display:block;margin-top:6px;color:var(--ink-3);font-size:13px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.list{display:grid;grid-template-columns:1fr;column-gap:40px}
@media (min-width:700px){.list{grid-template-columns:1fr 1fr}}

.card{position:relative;display:flex;align-items:stretch;min-width:0;border-bottom:1px solid var(--line)}
.open-btn{
  flex:1;min-width:0;display:flex;gap:18px;align-items:center;text-align:left;border:0;background:transparent;
  padding:20px 0;cursor:pointer;
}
@media (hover:hover){.open-btn:hover h3{color:var(--oak)}}
.thumb{
  flex:none;width:84px;height:84px;display:grid;place-items:center;overflow:hidden;border-radius:2px;
  background:var(--oak-soft);color:var(--oak);font-family:var(--serif);font-size:30px;font-weight:500;
}
.thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.82) contrast(.98)}
.card h3{margin:0 0 8px;font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.3;text-wrap:balance;transition:color .2s}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;font-size:12px;letter-spacing:.08em;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center}
.tag+.tag::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--ink-3);margin:0 10px}
.tag.veg{color:var(--moss)}
.tag.new{color:var(--beni)}
.src{font-size:12px;color:var(--ink-3);margin-top:6px;letter-spacing:.04em}
.card-actions{display:flex;flex-direction:column;justify-content:center;gap:2px;padding-left:6px}
.icon-btn{
  width:40px;height:40px;border:0;border-radius:2px;background:transparent;cursor:pointer;
  display:grid;place-items:center;color:var(--ink-3);font-size:16px;line-height:1;transition:color .2s,background .2s;
}
@media (hover:hover){.icon-btn:hover{color:var(--ink);background:var(--surface-2)}}
.icon-btn.heart[aria-pressed="true"]{color:var(--beni)}
.icon-btn svg{width:20px;height:20px}

.empty{grid-column:1/-1;padding:48px 12px;text-align:center;color:var(--ink-2);font-family:var(--serif);font-size:17px}

/* ---------- Knapper ---------- */
.actions{display:flex;gap:12px;flex-wrap:wrap;margin:36px 0 12px}
.btn{
  flex:1 1 220px;border:1px solid var(--ink);border-radius:2px;padding:14px 20px;
  font-size:14px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;min-height:52px;
  transition:background .2s,color .2s,border-color .2s;
}
.btn.primary{background:var(--ink);color:var(--on-ink)}
@media (hover:hover){.btn.primary:hover{background:transparent;color:var(--ink)}}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
@media (hover:hover){.btn.ghost:hover{border-color:var(--ink)}}
.btn:disabled{opacity:.5;cursor:progress}
.btn.small{flex:none;min-height:34px;padding:6px 14px;font-size:11px}
.actions.quiet{margin-top:8px}

.status{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;font-size:14px;color:var(--ink-2);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.status.err{color:var(--beni)}
.spinner{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--ink);animation:spin 1.2s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.mode{font-size:12px;color:var(--ink-3);margin:10px 0 0;letter-spacing:.03em;max-width:60ch}

details.hidden-list{margin:32px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
details.hidden-list summary{cursor:pointer;padding:14px 0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
details.hidden-list ul{list-style:none;margin:0 0 12px;padding:0}
details.hidden-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-family:var(--serif)}

footer{color:var(--ink-3);font-size:12px;letter-spacing:.04em;text-align:center;padding:40px 20px 48px;max-width:760px;margin:0 auto}
footer .hanko{width:22px;height:22px;font-size:13px;display:inline-grid;vertical-align:middle;margin:0 0 0 6px;transform:rotate(-3deg)}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--on-ink);border-radius:2px;padding:10px 10px 10px 18px;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;letter-spacing:.03em;
  width:min(440px,calc(100% - 32px));
}
.toast button{border:0;background:transparent;color:var(--on-ink);font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:8px 10px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* ---------- Oppskrift ---------- */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
.sheet{
  position:fixed;left:0;right:0;bottom:0;max-height:94vh;max-height:94dvh;overflow:auto;z-index:11;
  background:var(--bg);border-radius:4px 4px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.7,.2,1);
  padding:0 0 calc(32px + env(safe-area-inset-bottom));visibility:hidden;
}
.open .sheet-bg{opacity:1;pointer-events:auto}
.open .sheet{transform:none;visibility:visible}
@media (min-width:760px){.sheet{left:50%;width:720px;margin-left:-360px}}
.sheet-top{position:sticky;top:0;background:var(--bg);padding:12px 24px 18px;border-bottom:1px solid var(--line);z-index:1}
.grab{width:36px;height:3px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet-title{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.sheet-title h2{margin:0;font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;text-wrap:balance}
.close{border:1px solid var(--line);background:transparent;width:40px;height:40px;border-radius:2px;font-size:15px;cursor:pointer;flex:none;color:var(--ink-2)}
@media (hover:hover){.close:hover{border-color:var(--ink);color:var(--ink)}}
.sheet-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}
.pill-btn{border:1px solid var(--line);background:transparent;border-radius:2px;min-height:42px;padding:6px 16px;font-size:13px;letter-spacing:.06em;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
@media (hover:hover){.pill-btn:hover{border-color:var(--ink);color:var(--ink)}}
.pill-btn.heart[aria-pressed="true"]{border-color:var(--beni);color:var(--beni)}
.pill-btn svg{width:16px;height:16px}
.sheet-body{padding:24px}
.sheet h3{font-family:var(--sans);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.22em;color:var(--ink-3);margin:32px 0 12px}
#dImg:empty + h3{margin-top:0}
.hero-img{width:100%;aspect-ratio:16/9;max-width:100%;object-fit:cover;border-radius:2px;display:block;background:var(--surface-2);filter:saturate(.85)}
.ing{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ing li{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.qty{flex:none;width:92px;color:var(--oak);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:0 0 18px 44px;counter-increment:s;font-size:15px;max-width:62ch}
.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:0;font-family:var(--serif);font-size:15px;color:var(--oak);letter-spacing:.04em}
.note{border-left:2px solid var(--moss);padding:4px 0 4px 16px;margin-top:12px;font-size:14px;color:var(--ink-2)}
.note b{display:block;font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--moss);margin-bottom:4px}
.srcbox{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.srcbox a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--oak);text-underline-offset:4px}

@media (max-width:420px){
  .brand h1{font-size:40px}
  .thumb{width:72px;height:72px}
  .sheet-top,.sheet-body{padding-left:20px;padding-right:20px}
}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-bg,.chip,.btn{transition:none}.spinner{animation-duration:3s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div>
        <h1>Middag</h1>
        <p>Hva skal vi spise i dag?</p>
      </div>
      <span class="hanko" aria-hidden="true">食</span>
    </div>
  </header>

  <section class="panel" aria-label="Valg">
    <div class="group">
      <p class="label">Råvare</p>
      <div class="chips" id="proteinChips"></div>
    </div>
    <div class="group">
      <p class="label">Kjøkken</p>
      <div class="chips" id="cuisineChips"></div>
    </div>
    <div class="group row">
      <div>
        <p class="label">Antall personer</p>
        <div class="stepper" role="group" aria-label="Antall personer">
          <button class="step-btn" id="minus" aria-label="Færre personer">−</button>
          <span class="step-val" id="persons" aria-live="polite">4 personer</span>
          <button class="step-btn" id="plus" aria-label="Flere personer">+</button>
        </div>
      </div>
      <div>
        <p class="label"><label for="sort">Sorter</label></p>
        <select id="sort">
          <option value="match">Best treff</option>
          <option value="time">Raskest først</option>
          <option value="name">Navn A–Å</option>
        </select>
      </div>
    </div>
  </section>

  <div class="results-head">
    <div>
      <h2>Forslag</h2>
      <span class="count" id="count"></span>
    </div>
    <button class="chip fav" id="favOnly" aria-pressed="false"></button>
  </div>
  <div class="list" id="list"></div>

  <div class="actions">
    <button class="btn primary" id="addNew">Legg til nye oppskrifter</button>
    <button class="btn ghost" id="surprise">Overrask meg</button>
  </div>
  <div id="status" class="status" hidden role="status"></div>
  <p class="mode" id="modeNote"></p>

  <details class="hidden-list" id="hiddenBox" hidden>
    <summary id="hiddenSummary">Fjernede oppskrifter</summary>
    <ul id="hiddenList"></ul>
  </details>

  <div class="actions quiet">
    <a class="btn ghost" id="searchMore" target="_blank" rel="noopener">Søk etter flere på nettet</a>
  </div>
</div>
<footer>Lagre favoritter med hjertet, og fjern retter du ikke liker med krysset. Valgene lagres på denne enheten.<span class="hanko" aria-hidden="true">食</span></footer>

<div id="toast" class="toast" hidden role="status"><span id="toastText"></span><button id="toastUndo">Angre</button></div>

<div id="sheetRoot">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="sheet-top">
      <div class="grab"></div>
      <div class="sheet-title">
        <h2 id="dTitle"></h2>
        <button class="close" id="close" aria-label="Lukk">✕</button>
      </div>
      <div class="meta" id="dMeta" style="margin-top:6px"></div>
      <div class="sheet-tools">
        <div class="stepper" role="group" aria-label="Antall personer">
          <button class="step-btn" id="dMinus" aria-label="Færre personer">−</button>
          <span class="step-val" id="dPersons"></span>
          <button class="step-btn" id="dPlus" aria-label="Flere personer">+</button>
        </div>
        <button class="pill-btn heart" id="dFav" aria-pressed="false"></button>
        <button class="pill-btn" id="dHide">Liker ikke</button>
      </div>
    </div>
    <div class="sheet-body">
      <div id="dImg"></div>
      <h3>Ingredienser</h3>
      <ul class="ing" id="dIng"></ul>
      <h3>Slik gjør du</h3>
      <ol class="steps" id="dSteps"></ol>
      <div id="dNote"></div>
      <div class="srcbox" id="dSrc"></div>
    </div>
  </div>
</div>

 // ===== ASIATISK =====
 {id:"green-curry",img:"https://images.matprat.no/uxn8vdx3vk-normal/710/og.png",t:"Green curry med kylling",p:"kylling",c:"asiatisk",min:30,e:"🍛",

 {id:"kyllingcurry-sotpotet",img:"https://images.matprat.no/eg8nhxkbbu-normal/710/og.png",t:"Kyllingcurry med søtpotet",p:"kylling",c:"asiatisk",min:40,e:"🍠",

 {id:"laks-teriyaki",img:"https://images.matprat.no/jjbjl5qhmq-normal/710/og.png",t:"Laks teriyaki",p:"fisk",c:"asiatisk",min:25,e:"🍣",

 {id:"thai-fiskekaker",img:"https://www.godfisk.no/contentassets/fb2bede14e19404587e439074149094b/full_file_1347977371.jpg?width=1200&height=630&transform=DownFill&hash=5b8b914042b7e5ea20cc3ba62bf1eaf2",t:"Thailandske fiskekaker",p:"fisk",c:"asiatisk",min:35,e:"🐟",

 {id:"tofu-wok",img:"https://cdn.sanity.io/images/2vehtkn0/production/cdb7a70e1c613e69c12285604bc508a889e719b7-2000x1500.jpg?w=800",t:"Wok med tofu og cashewnøtter",p:"vegetar",c:"asiatisk",min:25,e:"🥦",

 {id:"torsk-i-form",img:"https://images.matprat.no/d6nqay4uv3-normal/710/og.png",t:"Torsk i form med tomat og oliven",p:"fisk",c:"italiensk",min:35,e:"🫒",

 {id:"spanakopita",img:"https://marihult.no/wp-content/uploads/2015/01/Spinatpai.jpg",t:"Spanakopita – spinatpai med feta",p:"vegetar",c:"gresk",min:60,e:"🥧",

const PROTEINS=[["kylling","Kylling"],["kjøtt","Kjøtt"],["fisk","Fisk"],["vegetar","Vegetar"]];
const CUISINES=[["asiatisk","Asiatisk"],["italiensk","Italiensk"],["gresk","Gresk"],["libanesisk","Libanesisk"]];
const LBL=Object.fromEntries([...PROTEINS,...CUISINES]);
const P_EMOJI={kylling:"🍗","kjøtt":"🥩",fisk:"🐟",vegetar:"🥦"};
const inClaude=typeof window.claude?.use==="function";
/* Bilder fra oppskriftssidene vises når appen ligger på egen server (GitHub). claude.ai-sider kan ikke laste bilder fra andre nettsteder. */
const SHOW_IMG=!inClaude;
const UNITS=["g","kg","dl","l","ss","ts","stk","fedd","bunt","ark","skiver","klype"];
const BASE=4;
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.2.3.6.3.8 0 .7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C18.9 16.4 12 21 12 21z"/></svg>';

/* ---------- Lagring (per enhet) ---------- */
const store={get(k,d){try{const v=localStorage.getItem("middag."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem("middag."+k,JSON.stringify(v))}catch(e){}}};
const state={
  protein:new Set(store.get("protein",[])),
  cuisine:new Set(store.get("cuisine",[])),
  persons:store.get("persons",4),
  sort:store.get("sort","match"),
  favOnly:store.get("favOnly",false),
  liked:new Set(store.get("liked",[])),
  hidden:new Set(store.get("hidden",[])),
  added:store.get("added",[]),
  fresh:new Set(),
  open:null, busy:null
};
function save(){
  store.set("protein",[...state.protein]);store.set("cuisine",[...state.cuisine]);store.set("persons",state.persons);
  store.set("sort",state.sort);store.set("favOnly",state.favOnly);store.set("liked",[...state.liked]);
  store.set("hidden",[...state.hidden]);store.set("added",state.added);
}
const all=()=>RECIPES.concat(state.added);
const byId=id=>all().find(r=>r.id===id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Skalering og norske enheter ---------- */
const FR={0.25:"¼",0.5:"½",0.75:"¾"};
function nf(x,dec=1){return (Math.round(x*10**dec)/10**dec).toLocaleString("nb-NO",{maximumFractionDigits:dec})}
function frac(x){const q=Math.max(0.25,Math.round(x*4)/4),w=Math.floor(q),r=+(q-w).toFixed(2);return (w?w:"")+(r?FR[r]:"")}
function fmt(a,u){
  if(u==="kg") return fmt(a*1000,"g");
  if(u==="l") return fmt(a*10,"dl");
  if(u==="g"){ if(a>=1000) return nf(a/1000,a>=2000?1:2)+" kg"; a=a<20?Math.max(1,Math.round(a)):a<100?Math.round(a/5)*5:Math.round(a/10)*10; return a+" g"}
  if(u==="dl"){ if(a<0.3) return fmt(a/0.15,"ss"); if(a>=10) return nf(a/10,1)+" l"; return nf(Math.round(a*4)/4,2)+" dl"}
  if(u==="ss"){ if(a>6) return fmt(a*0.15,"dl"); if(a<0.75) return fmt(a*3,"ts"); return frac(a)+" ss"}
  if(u==="ts"){ if(a>=3) return fmt(a/3,"ss"); return frac(a)+" ts"}
  if(u==="stk"||u==="bunt") return frac(a)+" "+u;
  if(u==="fedd"||u==="ark"||u==="skiver"||u==="klype") return Math.max(1,Math.round(a))+" "+u;
  return nf(a)+(u?" "+u:"");
}
function scaled(r){
  const f=state.persons/(r.base||BASE);
  return r.ing.map(([m,u,n])=>({q:(typeof m==="number"&&m>0)?fmt(m*f,u):(u||""),n}));
}

/* ---------- Filtrering og sortering ---------- */
function visible(){
  let list=all().filter(r=>!state.hidden.has(r.id)
    &&(!state.protein.size||state.protein.has(r.p))
    &&(!state.cuisine.size||state.cuisine.has(r.c))
    &&(!state.favOnly||state.liked.has(r.id)));
  const byName=(a,b)=>a.t.localeCompare(b.t,"nb");
  if(state.sort==="time") list.sort((a,b)=>a.min-b.min||byName(a,b));
  else if(state.sort==="name") list.sort(byName);
  else{
    const ci=Object.fromEntries(CUISINES.map(([k],i)=>[k,i])),pi=Object.fromEntries(PROTEINS.map(([k],i)=>[k,i]));
    const s=r=>(state.fresh.has(r.id)?2:0)+(state.liked.has(r.id)?1:0);
    list.sort((a,b)=>s(b)-s(a)||ci[a.c]-ci[b.c]||pi[a.p]-pi[b.p]||a.min-b.min);
  }
  return list;
}

let sampleFn=null;
function setStatus(html,{err=false,busy=false,stop=false}={}){

function targets(){
  const ps=state.protein.size?[...state.protein]:PROTEINS.map(p=>p[0]);

function addRecipes(list){

    else setStatus("Fant ingen nye oppskrifter for dette valget. Prøv et annet kjøkken eller en annen råvare.",{err:true});
    if(n) document.querySelector(".results-head").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){

function errText(e){
  switch(e?.code){
    case "not_granted": case "sampling_disabled": case "capability_disabled": case "not_declared":
      return "Claude fikk ikke lov til å lage oppskrifter i denne visningen. Last siden på nytt og trykk «Tillat» for å prøve igjen.";
    case "rate_limited": return "For mange forespørsler akkurat nå. Vent litt og prøv igjen.";
    case "invalid_json": case "empty_completion": return "Svaret kom i feil format. Prøv igjen.";
    case "session_expired": return "Du må logge inn på nytt.";
    case "net": return "Fikk ikke kontakt med oppskriftsbasen. Sjekk nettforbindelsen og prøv igjen.";
    default: return "Noe gikk galt under hentingen. Prøv igjen.";

/* --- Claude --- */
async function fromClaude(signal){
  setStatus("Claude lager nye oppskrifter … det tar vanligvis 20–60 sekunder.",{busy:true,stop:true});
  const {ps,cs}=targets();
  const existing=all().map(r=>r.t);
  const likes=all().filter(r=>state.liked.has(r.id)).map(r=>r.t);
  const dislikes=all().filter(r=>state.hidden.has(r.id)).map(r=>r.t);
  const prompt=`Du lager middagsoppskrifter til en norsk middagsapp. Lag 4 nye, ekte og velkjente middagsretter.

Råvare (p) må være én av: ${ps.join(", ")}.
Kjøkken (c) må være én av: ${cs.join(", ")}.
Spre rettene over kombinasjonene hvis det er flere. "kjøtt" betyr storfe, svin eller lam (ikke kylling). "vegetar" betyr uten kjøtt og fisk.
Ingredienser skal være lette å få tak i i norske dagligvarebutikker.
Mengdene er for 4 personer. Bruk KUN disse enhetene: ${UNITS.join(", ")}. Ingen cups, oz, lb eller ml.
Ingredienser uten fast mengde (f.eks. salt og pepper) får mengde null og enhet "".
Skriv alt på norsk bokmål. 4–6 korte steg per rett, med temperatur i °C.

Ikke foreslå disse, de finnes allerede: ${existing.join("; ")}.
${likes.length?`Brukeren liker: ${likes.join("; ")}.`:""}
${dislikes.length?`Brukeren liker IKKE: ${dislikes.join("; ")}. Unngå lignende retter.`:""}

Svar med kun en JSON-array, uten annen tekst. Hvert element:
{"t":"Navn på retten","p":"kylling","c":"italiensk","min":35,"e":"🍝","ing":[[600,"g","kyllingfilet"],[null,"","salt og pepper"]],"st":["Steg 1","Steg 2"],"note":"valgfritt kort tips eller tom streng"}`;
  const data=await sampleFn.json(prompt,{signal,cache:false});
  if(!Array.isArray(data))throw {code:"invalid_json"};
  const now=Date.now();
  const list=data.map((x,i)=>normalizeAI(x,now+i)).filter(Boolean);
  return addRecipes(list);
}
function normalizeAI(x,stamp){
  if(!x||typeof x.t!=="string"||!Array.isArray(x.ing)||!Array.isArray(x.st))return null;
  const p=PROTEINS.some(([k])=>k===x.p)?x.p:null,c=CUISINES.some(([k])=>k===x.c)?x.c:null;
  if(!p||!c)return null;
  const ing=x.ing.filter(i=>Array.isArray(i)&&i[2]).map(([m,u,n])=>{
    const num=Number(m);u=String(u||"").toLowerCase().trim();
    if(!(num>0)||!UNITS.includes(u))return [null,"",String(n)];
    return [num,u,String(n)];
  });
  if(!ing.length)return null;
  return {id:"ai-"+stamp,t:x.t.slice(0,80),p,c,min:Math.max(5,Math.min(240,Number(x.min)||30)),
    e:typeof x.e==="string"?x.e.slice(0,4):P_EMOJI[p],ing,st:x.st.map(String).slice(0,10),
    note:typeof x.note==="string"&&x.note.trim()?x.note.slice(0,200):"",sn:"Laget av Claude",kind:"ai"};
}

/* --- TheMealDB --- */
const API="https://www.themealdb.com/api/json/v1/1/";
const AREAS={asiatisk:["Chinese","Japanese","Thai","Vietnamese","Malaysian","Filipino","Indonesian","South Korean"],
  italiensk:["Italian"],gresk:["Greek","Cypriot"],libanesisk:["Lebanese","Syrian","Palestinian","Jordanian"]};
const CATS={kylling:["Chicken"],"kjøtt":["Beef","Lamb","Pork","Goat"],fisk:["Seafood"],vegetar:["Vegetarian","Vegan"]};
const listCache={};
async function getJSON(url,signal){
  let res;try{res=await fetch(url,{signal})}catch(e){if(e.name==="AbortError")throw e;throw {code:"net"}}
  if(!res.ok)throw {code:"net"};return res.json();
}
async function mealIds(kind,val,signal){
  const key=kind+val;if(listCache[key])return listCache[key];
  const d=await getJSON(API+"filter.php?"+kind+"="+encodeURIComponent(val),signal);
  return listCache[key]=(d.meals||[]).map(m=>m.idMeal);
}
async function fromMealDB(signal){
  setStatus("Henter oppskrifter …",{busy:true,stop:true});
  const {ps,cs}=targets();
  const areaIds={},catIds={};
  await Promise.all([
    ...cs.map(async c=>{areaIds[c]=new Set((await Promise.all(AREAS[c].map(a=>mealIds("a",a,signal)))).flat())}),
    ...ps.map(async p=>{catIds[p]=new Set((await Promise.all(CATS[p].map(k=>mealIds("c",k,signal)))).flat())})
  ]);
  const known=new Set(all().map(r=>r.id));
  const pool=[];
  for(const c of cs)for(const p of ps)for(const id of areaIds[c])
    if(catIds[p].has(id)&&!known.has("mdb-"+id))pool.push({id,c,p});
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=pool.slice(0,4);
  if(!pick.length)return 0;
  const meals=await Promise.all(pick.map(async x=>{
    const d=await getJSON(API+"lookup.php?i="+x.id,signal);const m=d.meals&&d.meals[0];
    return m?fromMeal(m,x.c,x.p):null;
  }));
  return addRecipes(meals.filter(Boolean));
}
const UNICODE_FR={"½":".5","¼":".25","¾":".75","⅓":".333","⅔":".667","⅛":".125"};
function parseNum(s){
  s=s.trim();
  let m=s.match(/^(\d+)\s+(\d+)\/(\d+)/);if(m)return {n:+m[1]+m[2]/m[3],rest:s.slice(m[0].length)};
  m=s.match(/^(\d+)\/(\d+)/);if(m)return {n:m[1]/m[2],rest:s.slice(m[0].length)};
  m=s.match(/^(\d*[.,]?\d+)(\s*-\s*\d*[.,]?\d+)?/);if(m)return {n:parseFloat(m[1].replace(",",".")),rest:s.slice(m[0].length)};
  return null;
}
const U_MAP=[
  [/^(cups?|c)\b\.?/,"dl",2.37],[/^(tablespoons?|tbsp|tbs|tbls?)\b\.?/,"ss",1],[/^(teaspoons?|tsp)\b\.?/,"ts",1],
  [/^(pounds?|lbs?)\b\.?/,"g",454],[/^(ounces?|oz)\b\.?/,"g",28.35],[/^(kilograms?|kg)\b/,"g",1000],
  [/^(grams?|gr|g)\b/,"g",1],[/^(millilitres?|milliliters?|ml)\b/,"dl",0.01],[/^(litres?|liters?|l)\b/,"dl",10],
  [/^(cloves?)\b/,"fedd",1],[/^(pinch(es)?|dash(es)?)\b/,"klype",1],[/^(slices?)\b/,"skiver",1],[/^(bunch(es)?)\b/,"bunt",1],
  [/^(handfuls?)\b/,"stk",1]
];
function convertMeasure(raw){
  let s=String(raw||"").toLowerCase().trim();
  s=s.replace(/(\d)\s*([½¼¾⅓⅔⅛])/g,(m,d,f)=>d+UNICODE_FR[f]).replace(/[½¼¾⅓⅔⅛]/g,f=>"0"+UNICODE_FR[f]);
  const num=parseNum(s);
  if(!num){const w={"to taste":"etter smak","pinch":"1 klype","dash":"1 klype","to serve":"til servering","garnish":"til pynt","as required":"etter behov"}[s]; return {m:null,u:w||(raw?String(raw).trim():""),extra:""}}
  let rest=num.rest.trim();
  const oz=rest.match(/^\(\s*(\d+[.,]?\d*)\s*(oz|ounces?)\.?\s*\)/);
  if(oz)return {m:num.n*parseFloat(oz[1])*28.35,u:"g",extra:""};
  for(const [re,u,f] of U_MAP){const m=rest.match(re);if(m)return {m:num.n*f,u,extra:rest.slice(m[0].length).trim()}}
  return {m:num.n,u:"stk",extra:rest};
}
const NO={"chicken":"kylling","chicken breast":"kyllingbryst","chicken breasts":"kyllingbryst","chicken thighs":"kyllinglår","chicken legs":"kyllinglår",
 "onion":"løk","onions":"løk","red onion":"rødløk","garlic":"hvitløk","garlic clove":"hvitløksfedd","ginger":"ingefær","salt":"salt","pepper":"pepper",
 "black pepper":"sort pepper","olive oil":"olivenolje","vegetable oil":"nøytral olje","oil":"olje","butter":"smør","water":"vann","sugar":"sukker",
 "brown sugar":"brunt sukker","soy sauce":"soyasaus","fish sauce":"fiskesaus","rice":"ris","basmati rice":"basmatiris","lemon":"sitron","lemon juice":"sitronsaft",
 "lime":"lime","tomato":"tomat","tomatoes":"tomater","chopped tomatoes":"hakkede tomater","tomato puree":"tomatpuré","eggs":"egg","egg":"egg",
 "flour":"hvetemel","plain flour":"hvetemel","milk":"melk","double cream":"kremfløte","cream":"fløte","parmesan":"parmesan","feta":"fetaost",
 "spinach":"spinat","carrots":"gulrøtter","carrot":"gulrot","potatoes":"poteter","coriander":"koriander","parsley":"persille","basil":"basilikum",
 "mint":"mynte","dill":"dill","oregano":"oregano","cumin":"spisskummen","paprika":"paprikapulver","cinnamon":"kanel","chilli":"chili","chili powder":"chilipulver",
 "red pepper":"rød paprika","green pepper":"grønn paprika","aubergine":"aubergine","eggplant":"aubergine","courgette":"squash","zucchini":"squash",
 "mushrooms":"sopp","chickpeas":"kikerter","lentils":"linser","tahini":"tahini","greek yogurt":"gresk yoghurt","yogurt":"yoghurt","honey":"honning",
 "prawns":"reker","shrimp":"reker","salmon":"laks","cod":"torsk","white fish":"hvit fisk","tofu":"tofu","coconut milk":"kokosmelk","spring onions":"vårløk",
 "sesame oil":"sesamolje","sesame seeds":"sesamfrø","cornstarch":"maisstivelse","cornflour":"maisstivelse","noodles":"nudler","pasta":"pasta",
 "spaghetti":"spaghetti","white wine":"hvitvin","red wine":"rødvin","chicken stock":"kyllingkraft","vegetable stock":"grønnsakskraft","bay leaf":"laurbærblad"};
const F2C=s=>s.replace(/(\d{3})\s*°?\s*F\b/g,(m,f)=>Math.round((f-32)*5/9/5)*5+" °C");
function fromMeal(m,c,p){
  const ing=[];
  for(let i=1;i<=20;i++){
    const name=(m["strIngredient"+i]||"").trim();if(!name)continue;
    const cv=convertMeasure(m["strMeasure"+i]);
    const n=(NO[name.toLowerCase()]||name)+(cv.extra?` (${cv.extra})`:"");
    ing.push(cv.m?[Math.round(cv.m*100)/100,cv.u,n]:[null,cv.u,n]);
  }
  const st=F2C(m.strInstructions||"").split(/\r?\n+/).map(s=>s.replace(/^\s*(step\s*)?\d+[.):]?\s*/i,"").trim()).filter(s=>s.length>3);
  return {id:"mdb-"+m.idMeal,t:m.strMeal,p,c,min:0,e:P_EMOJI[p],img:m.strMealThumb||"",thumb:m.strMealThumb?m.strMealThumb+"/preview":"",ing,st:st.length?st:["Se originaloppskriften."],
    sn:"TheMealDB (engelsk)",src:m.strSource||("https://www.themealdb.com/meal/"+m.idMeal),kind:"mealdb",base:4};
}

$("close").onclick=closeRecipe;$("sheetBg").onclick=closeRecipe;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.open)closeRecipe()});
$("surprise").onclick=()=>{const l=visible();const pool=l.length?l:all().filter(r=>!state.hidden.has(r.id));if(pool.length)openRecipe(pool[Math.floor(Math.random()*pool.length)].id)};

update();modeNote();
if(inClaude){
  window.claude.use("sample").then(fn=>{sampleFn=fn||null;modeNote()}).catch(()=>{});
}

</script>
