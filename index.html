  --wood:#C8954A; --basil:#4F7F2C; --basil-soft:#E3EFCF; --heart:#D6342A;
  --on-accent:#FFFFFF; --shadow:0 1px 2px rgba(90,50,10,.08),0 6px 18px rgba(90,50,10,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E140B; --surface:#2A1D11;
    --surface-2:#352516; --ink:#F7EBD3; --ink-2:#C9AE8A; --line:#4A3520;
    --orange:#FA8E1F; --orange-2:#FFA64A; --orange-soft:#4A2A0E;
    --wood:#D9A962; --basil:#9CCB6E; --basil-soft:#26361A; --heart:#FF6B5F;
    --on-accent:#2A1405; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1E140B; --surface:#2A1D11; --surface-2:#352516; --ink:#F7EBD3; --ink-2:#C9AE8A; --line:#4A3520;
  --orange:#FA8E1F; --orange-2:#FFA64A; --orange-soft:#4A2A0E;
  --wood:#D9A962; --basil:#9CCB6E; --basil-soft:#26361A; --heart:#FF6B5F;
  --on-accent:#2A1405; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* Header */
header{padding:calc(14px + env(safe-area-inset-top)) 0 6px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:12px;box-shadow:var(--shadow)}
.brand h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.5px;line-height:1}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:14px;font-weight:600}

/* Filters */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin:14px 0;box-shadow:var(--shadow)}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.group+.group{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1.5px solid var(--line);background:var(--bg);border-radius:999px;
  padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer;min-height:40px;
  display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,color .15s;
}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--on-accent)}
.chip:focus-visible,.btn:focus-visible,.card:focus-visible,.step-btn:focus-visible{outline:3px solid var(--orange-2);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.stepper{display:inline-flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.step-btn{width:44px;height:40px;border:0;background:transparent;font-size:22px;font-weight:800;cursor:pointer;color:var(--orange)}
.step-btn:disabled{opacity:.35;cursor:default}
.step-val{min-width:92px;text-align:center;font-weight:800}

select{
  font:inherit;font-weight:700;color:var(--ink);background:var(--bg);
  border:1.5px solid var(--line);border-radius:999px;padding:8px 34px 8px 14px;min-height:40px;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--orange) 50%),linear-gradient(135deg,var(--orange) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;
}

/* Results */
.results-head{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 10px}
.results-head h2{margin:0;font-size:20px;font-weight:900}
.count{color:var(--ink-2);font-weight:700;font-size:14px}
.list{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:620px){.list{grid-template-columns:1fr 1fr}}
.card{
  text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;
  padding:14px;cursor:pointer;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start;width:100%;
}
.card:active{transform:scale(.99)}
.emoji{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--orange-soft)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:800;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.tag{padding:2px 8px;border-radius:999px;background:var(--surface-2)}
.tag.veg{background:var(--basil-soft);color:var(--basil)}
.src{font-size:12px;color:var(--ink-2);margin-top:6px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--ink-2);font-weight:600}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 28px}
.btn{
  flex:1 1 200px;border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:16px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:48px;
}
.btn.primary{background:var(--orange);color:var(--on-accent)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
footer{color:var(--ink-2);font-size:12px;text-align:center;padding:0 16px 28px}

/* Detail sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(40,20,5,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.sheet{
  position:fixed;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;z-index:11;
  background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .25s ease;
  padding:0 0 calc(24px + env(safe-area-inset-bottom));
}
.open .sheet-bg{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
@media (min-width:720px){.sheet{left:50%;width:700px;margin-left:-350px}}
.sheet-top{position:sticky;top:0;background:var(--bg);padding:10px 16px 10px;border-bottom:1px solid var(--line);z-index:1}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-title{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.sheet-title h2{margin:0;font-size:22px;font-weight:900;line-height:1.2}
.close{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.sheet-body{padding:14px 16px}
.sheet h3{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--orange);margin:20px 0 8px}
.ing{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.ing li{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.qty{flex:none;width:86px;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:0 0 12px 40px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--orange-soft);color:var(--orange);font-weight:900;display:grid;place-items:center;font-size:14px}
.note{background:var(--basil-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;margin-top:12px}
.srcbox{margin-top:18px;font-size:14px;color:var(--ink-2)}
.srcbox a{color:var(--orange);font-weight:800}
.heart{color:var(--heart)}
@media (prefers-reduced-motion: reduce){.sheet,.sheet-bg{transition:none}}
</style>
</head>

const PROTEINS=[["kylling","🍗 Kylling"],["fisk","🐟 Fisk"],["vegetar","🥦 Vegetar"]];
const CUISINES=[["asiatisk","🥢 Asiatisk"],["italiensk","🍝 Italiensk"],["gresk","🫒 Gresk"],["libanesisk","🧆 Libanesisk"]];
const LBL=Object.fromEntries([...PROTEINS,...CUISINES].map(([k,v])=>[k,v.replace(/^\S+\s/,"")]));
const BASE=4;

/* ---------- Tilstand ---------- */
const store={get(k,d){try{const v=localStorage.getItem("middag."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem("middag."+k,JSON.stringify(v))}catch(e){}}};
const state={
  protein:new Set(store.get("protein",[])),
  cuisine:new Set(store.get("cuisine",[])),
  persons:store.get("persons",4),
  sort:store.get("sort","match"),
  open:null
};
function save(){store.set("protein",[...state.protein]);store.set("cuisine",[...state.cuisine]);store.set("persons",state.persons);store.set("sort",state.sort)}

/* ---------- Skalering og norske enheter ---------- */
const FR={0.25:"¼",0.5:"½",0.75:"¾"};
function nf(x,dec=1){return (Math.round(x*10**dec)/10**dec).toLocaleString("nb-NO",{maximumFractionDigits:dec})}
function frac(x){ // halve/kvarte for telbare ting og skjeer
  const q=Math.round(x*4)/4; const w=Math.floor(q), r=+(q-w).toFixed(2);
  if(q===0) return "¼";
  return (w?w:"")+(r?FR[r]:"") || String(w);
}
function fmt(amount,unit){
  let a=amount,u=unit;
  if(u==="g"){ if(a>=1000){return nf(a/1000,a>=2000?1:2)+" kg"} a=a<20?Math.round(a):a<100?Math.round(a/5)*5:Math.round(a/10)*10; return a+" g"}
  if(u==="dl"){ if(a<0.3){return fmt(a/0.15,"ss")} if(a>=10){return nf(a/10,1)+" l"} return nf(Math.round(a*4)/4,2)+" dl"}
  if(u==="ss"){ if(a>6){return fmt(a*0.15,"dl")} if(a<0.75){return fmt(a*3,"ts")} return frac(a)+" ss"}
  if(u==="ts"){ if(a>=3){return fmt(a/3,"ss")} return frac(a)+" ts"}
  if(u==="stk"||u==="bunt"){ return frac(Math.max(a,0.25)).replace(/^¼$/,"¼")+(u==="bunt"?" bunt":" stk")}
  if(u==="fedd"||u==="ark"||u==="skiver"){ return Math.max(1,Math.round(a))+" "+u }
  return nf(a)+" "+u;
}
function scaled(r){const f=state.persons/BASE;return r.ing.map(([m,u,n])=>({q:fmt(m*f,u),n}))}

/* ---------- Filtrering og sortering ---------- */
function score(r){
  let s=0; if(state.protein.has(r.p)) s+=2; if(state.cuisine.has(r.c)) s+=2; return s;
}
function results(){
  let list=RECIPES.filter(r=>(!state.protein.size||state.protein.has(r.p))&&(!state.cuisine.size||state.cuisine.has(r.c)));
  const byName=(a,b)=>a.t.localeCompare(b.t,"nb");
  if(state.sort==="time") list.sort((a,b)=>a.min-b.min||byName(a,b));
  else if(state.sort==="name") list.sort(byName);
  else { // best treff: kjøkken-rekkefølge, så råvare, så tid
    const ci=Object.fromEntries(CUISINES.map(([k],i)=>[k,i])), pi=Object.fromEntries(PROTEINS.map(([k],i)=>[k,i]));
    list.sort((a,b)=>score(b)-score(a)||ci[a.c]-ci[b.c]||pi[a.p]-pi[b.p]||a.min-b.min);
  }
  return list;
}

/* ---------- Rendering ---------- */
const $=id=>document.getElementById(id);
function chips(el,items,set){
  el.innerHTML="";
  const all=document.createElement("button");
  all.className="chip"; all.textContent="Alle"; all.setAttribute("aria-pressed",String(!set.size));
  all.onclick=()=>{set.clear();update()};
  el.appendChild(all);
  items.forEach(([k,v])=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=v; b.setAttribute("aria-pressed",String(set.has(k)));
    b.onclick=()=>{set.has(k)?set.delete(k):set.add(k);update()};
    el.appendChild(b);
  });
}
function personsText(n){return n+(n===1?" person":" personer")}
function tags(r){
  return `<span class="tag">${LBL[r.c]}</span><span class="tag ${r.p==="vegetar"?"veg":""}">${LBL[r.p]}</span><span class="tag">⏱ ${r.min} min</span>`;
}
function renderList(){
  const list=results(), el=$("list");
  $("count").textContent=list.length+(list.length===1?" rett":" retter");
  if(!list.length){el.innerHTML=`<div class="empty">Ingen treff på denne kombinasjonen. Prøv et annet valg – eller finn flere på nettet under.</div>`;return}
  el.innerHTML=list.map(r=>`
    <button class="card" data-id="${r.id}">
      <span class="emoji" aria-hidden="true">${r.e}</span>
      <span>
        <h3>${r.t}</h3>
        <span class="meta">${tags(r)}</span>
        <div class="src">Fra ${r.sn}</div>
      </span>
    </button>`).join("");
  el.querySelectorAll(".card").forEach(c=>c.onclick=()=>openRecipe(c.dataset.id));
}
function searchUrl(){
  const p=state.protein.size?[...state.protein].map(k=>LBL[k].toLowerCase()).join(" "):"";
  const c=state.cuisine.size?[...state.cuisine].map(k=>LBL[k].toLowerCase()).join(" "):"";
  const q=`${c} ${p} middag oppskrift`.replace(/\s+/g," ").trim();
  return "https://www.google.com/search?hl=no&q="+encodeURIComponent(q+" site:matprat.no OR site:tine.no OR site:godfisk.no OR site:meny.no OR site:trinesmatblogg.no");
}
function update(){
  chips($("proteinChips"),PROTEINS,state.protein);
  chips($("cuisineChips"),CUISINES,state.cuisine);
  $("persons").textContent=personsText(state.persons);
  $("minus").disabled=state.persons<=1; $("plus").disabled=state.persons>=12;
  $("sort").value=state.sort;
  $("searchMore").href=searchUrl();
  renderList(); if(state.open) renderDetail(); save();
}

/* ---------- Detaljvisning ---------- */
function renderDetail(){
  const r=RECIPES.find(x=>x.id===state.open); if(!r) return;
  $("dTitle").textContent=r.t;
  $("dMeta").innerHTML=tags(r);
  $("dPersons").textContent=personsText(state.persons);
  $("dMinus").disabled=state.persons<=1; $("dPlus").disabled=state.persons>=12;
  $("dIng").innerHTML=scaled(r).map(i=>`<li><span class="qty">${i.q}</span><span>${i.n}</span></li>`).join("");
  $("dSteps").innerHTML=r.st.map(s=>`<li>${s}</li>`).join("");
  $("dNote").innerHTML=r.note?`<div class="note">💡 ${r.note}</div>`:"";
  $("dSrc").innerHTML=`Tilpasset fra <a href="${r.src}" target="_blank" rel="noopener">${r.sn} ↗</a>. Mengdene er omregnet til norske mål og skalert til ${personsText(state.persons)}.`;
}
let lastFocus=null;
function openRecipe(id){
  lastFocus=document.activeElement; state.open=id; renderDetail();
  $("sheetRoot").classList.add("open"); document.body.style.overflow="hidden";
  document.querySelector(".sheet").scrollTop=0; $("close").focus();
}
function closeRecipe(){
  state.open=null; $("sheetRoot").classList.remove("open"); document.body.style.overflow="";
  if(lastFocus) lastFocus.focus();
}

/* ---------- Hendelser ---------- */
const bump=d=>{state.persons=Math.min(12,Math.max(1,state.persons+d));update()};
$("minus").onclick=()=>bump(-1); $("plus").onclick=()=>bump(1);
$("dMinus").onclick=()=>bump(-1); $("dPlus").onclick=()=>bump(1);
$("sort").onchange=e=>{state.sort=e.target.value;update()};
$("close").onclick=closeRecipe; $("sheetBg").onclick=closeRecipe;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.open)closeRecipe()});
$("surprise").onclick=()=>{const l=results();const pool=l.length?l:RECIPES;openRecipe(pool[Math.floor(Math.random()*pool.length)].id)};

update();
</script>
</body>
